<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Prefer Simplified Chinese Source Han SC fonts for CJK fallback</description>
  <match target="pattern">
    <test name="lang" qual="all" compare="not_contains">
      <string>ja</string>
    </test>
    <test name="lang" qual="all" compare="not_contains">
      <string>ko</string>
    </test>
    <test name="lang" qual="all" compare="not_contains">
      <string>zh-tw</string>
    </test>
    <test name="lang" qual="all" compare="not_contains">
      <string>zh-hk</string>
    </test>
    <test name="family" qual="any" compare="eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="append_last" binding="strong">
      <string>Source Han Serif SC</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" qual="all" compare="not_contains">
      <string>ja</string>
    </test>
    <test name="lang" qual="all" compare="not_contains">
      <string>ko</string>
    </test>
    <test name="lang" qual="all" compare="not_contains">
      <string>zh-tw</string>
    </test>
    <test name="lang" qual="all" compare="not_contains">
      <string>zh-hk</string>
    </test>
    <test name="family" qual="all" compare="not_eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="append_last" binding="strong">
      <string>Source Han Sans SC</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
</fontconfig>
